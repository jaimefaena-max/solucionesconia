<!DOCTYPE html>
<html lang="es-CL">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- noindex, follow: una pantalla de login no aporta nada en resultados de
       búsqueda y compite con páginas que sí venden. `follow` se conserva para
       no cortar el flujo de enlaces hacia la landing. -->
  <meta name="robots" content="noindex, follow" />
  <title>Portal Clientes · Soluciones con IA</title>
  <meta name="description" content="Acceso al portal privado de clientes de Soluciones con IA." />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

  <!-- Design System v2: la MISMA hoja compilada que usa la landing (reset y
       fondo #0f172a). El diseño propio de esta pantalla va en acceso.css. -->
  <link rel="stylesheet" href="/dist/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Igual que la home: Inter (eje opsz) para títulos, textos y campos, y
       JetBrains Mono solo para etiquetas técnicas. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="./acceso.css?v=20261021lujo" />
</head>

<body>
  <main class="marco">
    <a class="volver" href="/">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="15" height="15">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      Volver al sitio
    </a>

    <section class="tarjeta">
      <div class="marca">
        <img src="/assets/premium/LOGO.png" srcset="/assets/premium/LOGO.png 1x, /assets/premium/LOGO@2x.png 2x"
          alt="Soluciones con IA" width="110" height="80" />
      </div>

      <span class="kicker">Portal Clientes</span>
      <h1>Acceso privado</h1>
      <p class="sub">Ingresa con el correo y la contraseña que te entregó tu ejecutivo.</p>

      <!-- role="alert" + aria-live: un lector de pantalla anuncia el error sin
           que el usuario tenga que ir a buscarlo. -->
      <p class="aviso" id="aviso" role="alert" aria-live="assertive"></p>

      <!-- novalidate: la validación nativa mostraría burbujas del navegador con
           su propio estilo, ajenas al diseño. La comprobación se hace abajo. -->
      <form id="formulario" novalidate>
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="username" inputmode="email" spellcheck="false"
            autocapitalize="none" required placeholder="nombre@empresa.cl" />
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="campo-clave">
            <input type="password" id="password" name="password" autocomplete="current-password" required
              placeholder="••••••••••••" />
            <!-- Mostrar/ocultar la contraseña. type="button": nunca envía el formulario. -->
            <button type="button" class="ver-clave" id="ver-clave" aria-controls="password" aria-pressed="false"
              aria-label="Mostrar contraseña" title="Mostrar contraseña">
              <svg class="ojo-abierto" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="ojo-cerrado" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1"/><path d="M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="enviar">Entrar</button>
      </form>

      <p class="pie">
        <span class="candado">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="14" height="14">
            <rect x="4" y="10" width="16" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          Conexión cifrada
        </span>
      </p>
    </section>
  </main>

  <script src="./acceso.js?v=20261021ojo"></script>
</body>

</html>
