<!DOCTYPE html>
<html lang="es-CL">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- noindex, follow: una pantalla de login no aporta nada en resultados de
       búsqueda y compite con páginas que sí venden. `follow` se conserva para
       no cortar el flujo de enlaces hacia la landing. -->
  <meta name="robots" content="noindex, follow" />
  <title>Portal Clientes · Soluciones con IA</title>
  <meta name="description" content="Acceso al portal privado de clientes de Soluciones con IA." />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

  <!-- Design System v2: la MISMA hoja compilada que usa la landing. De aquí
       salen `sc-btn-primary` y su hover, el reset y el fondo #0f172a. Enlazarla
       —en vez de copiar estilos— es lo que garantiza que el botón de esta
       pantalla envejezca igual que los de la home. -->
  <link rel="stylesheet" href="/dist/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Inter (cuerpo, igual que la landing) + JetBrains Mono, que es la voz del
       portal VIP. La mezcla es deliberada: esta página es el PUENTE entre la
       web comercial y el expediente privado, y debe reconocerse en las dos. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="./acceso.css" />
</head>

<body>
  <main class="marco">
    <a class="volver" href="/">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="13" height="13">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      Volver al sitio
    </a>

    <section class="tarjeta">
      <div class="marca">
        <img src="/assets/premium/LOGO.png" srcset="/assets/premium/LOGO.png 1x, /assets/premium/LOGO@2x.png 2x"
          alt="Soluciones con IA" width="110" height="80" />
      </div>

      <span class="kicker">Portal Clientes</span>
      <h1>Acceso privado</h1>
      <p class="sub">Ingresa con el correo y la contraseña que te entregó tu ejecutivo.</p>

      <!-- role="alert" + aria-live: un lector de pantalla anuncia el error sin
           que el usuario tenga que ir a buscarlo. -->
      <p class="aviso" id="aviso" role="alert" aria-live="assertive"></p>

      <!-- novalidate: la validación nativa mostraría burbujas del navegador con
           su propio estilo, ajenas al diseño. La comprobación se hace abajo. -->
      <form id="formulario" novalidate>
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="username" inputmode="email" spellcheck="false"
            autocapitalize="none" required placeholder="nombre@empresa.cl" />
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required
            placeholder="••••••••••••" />
        </div>

        <button type="submit" id="enviar">Entrar</button>
      </form>

      <p class="pie">
        <span class="candado">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="12" height="12">
            <rect x="4" y="10" width="16" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          ACCESO AUDITADO Y CIFRADO
        </span>
      </p>
    </section>
  </main>

  <script src="./acceso.js"></script>
</body>

</html>
